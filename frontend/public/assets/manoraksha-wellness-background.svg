<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffaf3"/>
    <stop offset=".42" stop-color="#f9eee9"/>
    <stop offset=".72" stop-color="#eee4ed"/>
    <stop offset="1" stop-color="#ded5e3"/>
  </linearGradient>
  <radialGradient id="sun"><stop offset="0" stop-color="#fff8df" stop-opacity=".98"/><stop offset=".45" stop-color="#f8dfb0" stop-opacity=".55"/><stop offset="1" stop-color="#f8dfb0" stop-opacity="0"/></radialGradient>
  <linearGradient id="far" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9cbdc"/><stop offset="1" stop-color="#cbbfd3"/></linearGradient>
  <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c6b8cf"/><stop offset="1" stop-color="#b6a9c5"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a99db9"/><stop offset="1" stop-color="#958ba9"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8dfe7"/><stop offset="1" stop-color="#cfc9d8"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="7" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer></filter>
  <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1080" height="1920" fill="url(#sky)"/>
<!-- soft watercolor clouds -->
<g fill="#fffdf8" opacity=".38" filter="url(#soft)">
 <ellipse cx="205" cy="315" rx="220" ry="62"/><ellipse cx="790" cy="400" rx="245" ry="70"/><ellipse cx="515" cy="220" rx="180" ry="45"/>
</g>
<g fill="#f4dfe0" opacity=".15" filter="url(#blur8)"><ellipse cx="130" cy="520" rx="180" ry="55"/><ellipse cx="890" cy="565" rx="210" ry="65"/></g>
<!-- warm horizon glow -->
<circle cx="690" cy="780" r="230" fill="url(#sun)"/>
<circle cx="690" cy="780" r="43" fill="#f8e7c3" opacity=".94"/>
<!-- distant mountains -->
<path d="M0 1010 L160 875 L270 965 L430 820 L565 955 L710 845 L865 965 L1015 875 L1080 930 L1080 1260 L0 1260Z" fill="url(#far)" opacity=".55"/>
<path d="M0 1110 L145 965 L300 1085 L475 900 L625 1060 L790 930 L930 1050 L1080 960 L1080 1330 L0 1330Z" fill="url(#mid)" opacity=".65"/>
<!-- mist -->
<g fill="#fff9f3" opacity=".32" filter="url(#blur8)"><ellipse cx="290" cy="1125" rx="340" ry="85"/><ellipse cx="780" cy="1180" rx="360" ry="92"/></g>
<!-- nearer valley -->
<path d="M0 1240 Q180 1130 370 1250 Q525 1360 670 1245 Q835 1110 1080 1250 L1080 1570 L0 1570Z" fill="url(#front)" opacity=".82"/>
<!-- river -->
<path d="M510 1190 C575 1290 455 1400 520 1510 C590 1620 790 1700 670 1920 L360 1920 C520 1735 490 1610 410 1500 C335 1395 430 1290 510 1190Z" fill="url(#water)" opacity=".92"/>
<path d="M545 1280 C565 1370 515 1450 555 1535 C600 1630 710 1715 650 1870" fill="none" stroke="#f7e9df" stroke-width="18" opacity=".38" filter="url(#blur8)"/>
<!-- gentle foreground haze -->
<path d="M0 1500 Q240 1440 480 1530 Q730 1615 1080 1490 L1080 1920 L0 1920Z" fill="#d9d0df" opacity=".25"/>
<!-- lotus left -->
<g transform="translate(40 1580)" stroke="#bda77f" stroke-width="4" stroke-linejoin="round">
 <path d="M55 285 Q190 150 340 255 Q205 325 55 285Z" fill="#b9abc7" opacity=".62"/>
 <path d="M0 320 Q105 210 220 295 Q100 365 0 320Z" fill="#c8b9d0" opacity=".7"/>
 <path d="M145 300 Q155 185 155 70" fill="none" stroke-width="5"/>
 <g fill="#f7dfe1"><path d="M155 235 Q75 190 70 115 Q145 125 178 220Z"/><path d="M155 235 Q235 190 240 115 Q165 125 132 220Z"/><path d="M155 230 Q105 145 130 55 Q180 125 155 230Z"/><path d="M160 230 Q205 145 180 55 Q135 125 160 230Z"/><path d="M155 235 Q150 125 155 35 Q205 130 155 235Z"/></g>
 <circle cx="155" cy="228" r="15" fill="#f0c98d" stroke="none"/>
 <path d="M270 305 Q300 235 330 205" fill="none"/><path d="M328 208 Q370 175 395 210 Q360 245 328 208Z" fill="#c2b4cc"/>
 <path d="M95 315 Q120 250 145 225" fill="none"/>
</g>
<!-- lotus right -->
<g transform="translate(790 1640) scale(.78)" stroke="#bda77f" stroke-width="4" stroke-linejoin="round">
 <path d="M55 285 Q190 150 340 255 Q205 325 55 285Z" fill="#b9abc7" opacity=".62"/>
 <path d="M0 320 Q105 210 220 295 Q100 365 0 320Z" fill="#c8b9d0" opacity=".7"/>
 <path d="M145 300 Q155 185 155 70" fill="none" stroke-width="5"/>
 <g fill="#f7dfe1"><path d="M155 235 Q75 190 70 115 Q145 125 178 220Z"/><path d="M155 235 Q235 190 240 115 Q165 125 132 220Z"/><path d="M155 230 Q105 145 130 55 Q180 125 155 230Z"/><path d="M160 230 Q205 145 180 55 Q135 125 160 230Z"/><path d="M155 235 Q150 125 155 35 Q205 130 155 235Z"/></g>
 <circle cx="155" cy="228" r="15" fill="#f0c98d" stroke="none"/>
 <path d="M270 305 Q300 235 330 205" fill="none"/><path d="M328 208 Q370 175 395 210 Q360 245 328 208Z" fill="#c2b4cc"/>
</g>
<!-- subtle watercolor paper texture -->
<rect width="1080" height="1920" filter="url(#paper)" opacity=".8"/>
</svg>
